name: Release - iOS

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Version, or patch/minor/major. Defaults to package.json"
                type: string
                required: false

    workflow_call:
        outputs:
            version:
                value: ${{ jobs.build-release-ios.outputs.version }}
            build:
                value: ${{ jobs.build-release-ios.outputs.build }}
            pr_branch:
                value: ${{ jobs.build-release-ios.outputs.pr_branch }}
        inputs:
            version:
                description: "Version, or patch/minor/major. Defaults to package.json"
                type: string
                required: false

jobs:
    build-release-ios:
        name: Build release for iOS
        runs-on: macos-26-xlarge
        # Secrets: docs/release-secrets.md
        environment: ios-release
        env:
            DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        outputs:
            version: ${{ steps.fastlane.outputs.version }}
            build: ${{ steps.fastlane.outputs.build }}
            pr_branch: ${{ steps.fastlane.outputs.pr_branch }}

        # Proceed only if it's either not a release event or it's a pre-release.
        if: ${{ github.event_name != 'release' || (github.event_name == 'release' && github.event.release.prerelease) }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # If it's a pre-release, check out the tag corresponding to the pre-release;
                  # otherwise, use the triggering branch unless it's a non-pre-release event.
                  ref: ${{ (github.event_name == 'release' && github.event.release.prerelease && github.event.release.tag_name) || github.ref }}

            # Setup Node.js
            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - name: Restore dependency cache
              uses: ./.github/actions/yarn-cache
              with:
                  mode: restore

            - name: Select Xcode 26.2
              run: |
                  sudo xcode-select -s "$DEVELOPER_DIR"
                  xcodebuild -version

            - name: Install Node.js dependencies
              run: |
                  yarn install:all

            - name: Save dependency cache
              if: github.ref == 'refs/heads/main'
              uses: ./.github/actions/yarn-cache
              with:
                  mode: save

            # Install Homebrew and applesimutils for Detox
            - name: Install macOS dependencies
              run: |
                  brew install wix/brew/applesimutils
                  brew install fastlane
                  gem install cocoapods # Install CocoaPods globally
                  bundle install
              env:
                  HOMEBREW_NO_AUTO_UPDATE: 1
                  HOMEBREW_NO_INSTALL_CLEANUP: 1

            # Setup Ruby
            - name: Setup Ruby
              uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
              with:
                  bundler-cache: true

            # Update Bundler and Install Gems
            - name: Update Bundler and Install Gems
              run: |
                  gem install bundler -v 2.4.22 
                  bundle install --jobs 4 --retry 3
              env:
                  BUNDLE_GEMFILE: ${{ github.workspace }}/ios/Gemfile

            # Install CocoaPods dependencies
            - name: Install CocoaPods
              run: |
                  cd ios
                  bundle exec pod install

            # Install sentry properties
            - name: Sentry properties
              uses: mobiledevops/secret-to-file-action@085a45b601133564d1311589e82b5b136d0839bb # v2.0.0
              with:
                  base64-encoded-secret: ${{ secrets.IOS_SENTRY_PROPERTIES }}
                  filename: "sentry.properties"
                  is-executable: false
                  working-directory: "./ios"

            - name: Decode prod env
              uses: mobiledevops/secret-to-file-action@085a45b601133564d1311589e82b5b136d0839bb # v2.0.0
              with:
                  base64-encoded-secret: ${{ secrets.RN_ENV_PROD}}
                  filename: ".env.production"
                  is-executable: false
                  working-directory: "."

            - name: Build ipa with fastlane
              id: fastlane
              env:
                  MATCH_PASSWORD: ${{ secrets.IOS_MATCH_PASSWORD }}
                  APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
                  APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
                  APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.IOS_ASC_KEY_P8_BASE64 }}
                  APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64: "true"
                  INPUTS_VERSION: ${{inputs.version}}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
              run: |
                  cd ios
                  git config --global url."https://${{ secrets.CI_USER_TOKEN }}@github.com".insteadOf https://github.com
                  git config --local user.name  "github-actions[bot]"
                  git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  cd fastlane
                  fastlane build_ci username:${{secrets.CI_USER}} token:${{secrets.CI_USER_TOKEN}} ${INPUTS_VERSION:+version:"$INPUTS_VERSION"}

            - name: Notify Slack
              if: always()
              continue-on-error: true
              uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
              with:
                  webhook: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
                  webhook-type: incoming-webhook
                  payload: |
                      text: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} iOS release ${{ steps.fastlane.outputs.version || 'unknown version' }} (${{ steps.fastlane.outputs.build || 'no build' }}): ${{ job.status }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
