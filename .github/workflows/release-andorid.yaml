name: Release Android

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Version name. Defaults to package.json"
                type: string
                required: false

    workflow_call:
        inputs:
            version:
                description: "Version name. Defaults to package.json"
                type: string
                required: false
            pr_branch:
                description: "Branch of the iOS release PR to add the Android artifacts to"
                type: string
                required: false

jobs:
    build-test-android:
        name: Build and Release Android
        runs-on: ubuntu-24.04
        # Secrets: docs/release-secrets.md
        environment: android-release
        permissions:
            actions: write
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.pr_branch }}
                  fetch-depth: 0

            - name: Check PR_BRANCH
              run: echo ${INPUTS_PR_BRANCH}
              env:
                INPUTS_PR_BRANCH: ${{ inputs.pr_branch }}

            - name: Clear Ubuntu junk
              run: |
                sudo rm -rf "/usr/local/share/boost"
                sudo rm -rf "$AGENT_TOOLSDIRECTORY"

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - name: Restore dependency cache
              uses: ./.github/actions/yarn-cache
              with:
                  mode: restore

            - name: Configure Git user
              run: |
                  git config user.name "${GITHUB_ACTOR}"
                  git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

            - name: Install & Patch packages
              run: |
                yarn install:android

            - name: Setup Java
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  cache: gradle
                  distribution: "zulu"
                  java-version: "17"

            # Install sentry properties
            - name: Sentry properties
              uses: mobiledevops/secret-to-file-action@085a45b601133564d1311589e82b5b136d0839bb # v2.0.0
              with:
                  base64-encoded-secret: ${{ secrets.ANDROID_SENTRY_PROPERTIES }}
                  filename: "sentry.properties"
                  is-executable: false
                  working-directory: "./android"

            # Decode key_alias
            - name: Decode KEY_ALIAS
              uses: mobiledevops/secret-to-file-action@085a45b601133564d1311589e82b5b136d0839bb # v2.0.0
              with:
                  base64-encoded-secret: ${{ secrets.ANDROID_KEY_ALIAS }}
                  filename: "key_alias.txt"
                  is-executable: false
                  working-directory: "./android"

            # Decode key_password
            - name: Decode STORE_PASSWORD
              uses: mobiledevops/secret-to-file-action@085a45b601133564d1311589e82b5b136d0839bb # v2.0.0
              with:
                  base64-encoded-secret: ${{ secrets.ANDROID_STORE_PASSWORD }}
                  filename: "store_password.txt"
                  is-executable: false
                  working-directory: "./android"

            - name: Play Store service account
              uses: mobiledevops/secret-to-file-action@085a45b601133564d1311589e82b5b136d0839bb # v2.0.0
              with:
                  base64-encoded-secret: ${{ secrets.ANDROID_SERVICE_ACCOUNT }}
                  filename: "pc-api-4895632399891248889-903-1f538768f7fe.json"
                  is-executable: false
                  working-directory: "./android"

            # Install keystore properties
            - name: Keystore properties
              uses: mobiledevops/secret-to-file-action@085a45b601133564d1311589e82b5b136d0839bb # v2.0.0
              with:
                  base64-encoded-secret: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
                  filename: "keystore.properties"
                  is-executable: false
                  working-directory: "./android"

            # Download Keystore
            - name: Keystore file
              uses: mobiledevops/secret-to-file-action@085a45b601133564d1311589e82b5b136d0839bb # v2.0.0
              with:
                  base64-encoded-secret: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
                  filename: "release.keystore"
                  is-executable: false
                  working-directory: "./android"

            - name: Decode prod env
              uses: mobiledevops/secret-to-file-action@085a45b601133564d1311589e82b5b136d0839bb # v2.0.0
              with:
                  base64-encoded-secret: ${{ secrets.RN_ENV_PROD}}
                  filename: ".env.production"
                  is-executable: false
                  working-directory: "."

            - name: Build apk
              id: fastlane
              run: |
                  cd android
                  export STORE_PASSWORD="$(<store_password.txt)"
                  export KEY_PASSWORD="$(<store_password.txt)"
                  export KEY_ALIAS="$(<key_alias.txt)"
                  fastlane build_android_ci ${INPUTS_VERSION:+version_name:"$INPUTS_VERSION"}
              env:
                INPUTS_VERSION: ${{inputs.version}}
                SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

            - name: Artifact apk
              id: upload
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: latest-apk
                  path: ./android/app/build/outputs/apk/release/app-release.apk
                  retention-days: 5

            - name: Output Artifact id
              run: echo 'Artifact ID is ${{ steps.upload.outputs.artifact-id }}'

            - name: Commit and Push Changes
              if: inputs.pr_branch != ''
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INPUTS_PR_BRANCH: ${{ inputs.pr_branch }}
              run: |
                  git config user.name "vechain-ci"
                  git config user.email "vechain.ci@vechain.org"
                  git add --all
                  git commit -m "build: android build artifacts" || echo "No changes to commit"
                  git push origin HEAD:${INPUTS_PR_BRANCH}

            - name: Notify Slack
              if: always()
              continue-on-error: true
              uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
              with:
                  webhook: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
                  webhook-type: incoming-webhook
                  payload: |
                      text: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} Android release ${{ steps.fastlane.outputs.version || 'unknown version' }} (${{ steps.fastlane.outputs.build || 'no build' }}): ${{ job.status }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
