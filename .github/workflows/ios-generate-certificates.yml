name: iOS - Generate signing certificates

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    generate-certificates:
        name: Generate App Store certificates
        runs-on: macos-26
        environment: ios-release
        env:
            BUNDLE_GEMFILE: ${{ github.workspace }}/ios/Gemfile

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Ruby
              uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
              with:
                  bundler-cache: true

            - name: Generate certificates with fastlane
              working-directory: ios/fastlane
              env:
                  MATCH_PASSWORD: ${{ secrets.IOS_MATCH_PASSWORD }}
                  APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
                  APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
                  APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.IOS_ASC_KEY_P8_BASE64 }}
                  APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64: "true"
                  CI_USER_TOKEN: ${{ secrets.CI_USER_TOKEN }}
              run: |
                  git config --global url."https://${CI_USER_TOKEN}@github.com".insteadOf https://github.com
                  bundle exec fastlane generate_new_certificates
