on:
    workflow_call:

env:
    COVERAGE_PARENT_FOLDER: total-coverage

jobs:
    changes:
        runs-on: ubuntu-24.04
        permissions:
            pull-requests: read
        outputs:
            code: ${{ steps.filter.outputs.code }}
        steps:
            - name: Detect code changes
              id: filter
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  PR: ${{ github.event.pull_request.number }}
              run: |
                  if [ -z "$PR" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
                  files=$(gh api --paginate "/repos/$REPO/pulls/$PR/files" --jq '.[].filename')
                  if echo "$files" | grep -qvE '^(\.github|docs)/|\.md$' ||
                      echo "$files" | grep -qE '^\.github/(workflows/(unit-tests|install-build-test-scan)\.yml|actions/yarn-cache/)'; then
                      echo "code=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "code=false" >> "$GITHUB_OUTPUT"
                  fi

    unit:
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-24.04
        strategy:
            # Lint rides the matrix so it shares the install steps and runs alongside the shards.
            matrix:
                task: [lint, "1", "2", "3", "4"]
            fail-fast: false
        permissions:
            contents: read
            actions: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - name: Restore dependency cache
              uses: ./.github/actions/yarn-cache
              with:
                  mode: restore

            - name: Install & Patch packages
              run: |
                  yarn abi:install
                  yarn abi:build
                  for attempt in 1 2 3; do
                      yarn install --network-timeout 300000 && break
                      [ "$attempt" = 3 ] && exit 1
                      sleep 20
                  done
                  yarn abi:generate
                  yarn generate:indexer-schema:mainnet

            # Only main writes the cache: PR-scoped copies would evict it from the 10 GB quota.
            - name: Save dependency cache
              if: github.ref == 'refs/heads/main' && matrix.task == 'lint'
              uses: ./.github/actions/yarn-cache
              with:
                  mode: save

            - name: Lint, Format Check & TS Check
              if: matrix.task == 'lint'
              run: yarn lint && yarn format:check && yarn ts-check

            - name: Tests with Coverage
              if: matrix.task != 'lint'
              env:
                  NODE_OPTIONS: "--max_old_space_size=8192"
                  REACT_APP_WALLET_CONNECT_PROJECT_ID: "f1c07ceecbc6115eaa26b2221c2e43cd"
                  SHARD: ${{ matrix.task }}
              run: yarn test:coverage --shard=$SHARD/4 --json --outputFile=jest-results.json | tee ./coverage.txt  && exit ${PIPESTATUS[0]}

            - name: Upload coverage folder
              if: matrix.task != 'lint'
              env:
                  SHARD: ${{ matrix.task }}
              run: mkdir -p $COVERAGE_PARENT_FOLDER && mv coverage/coverage-final.json $COVERAGE_PARENT_FOLDER/$SHARD.json

            - name: Upload coverage folder
              if: matrix.task != 'lint'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage-artifacts-${{ matrix.task }}
                  path: ${{ env.COVERAGE_PARENT_FOLDER }}
                  retention-days: 1

            # Input for scripts/update-jest-shard-timings.mjs.
            - name: Upload test timings
              if: matrix.task != 'lint'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: jest-results-${{ matrix.task }}
                  path: jest-results.json
                  retention-days: 7

    coverage:
        runs-on: ubuntu-24.04
        needs: [unit]
        permissions:
            contents: read
            actions: read
            pull-requests: write
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  clean: false
            - name: Download coverage folder
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: coverage-artifacts-*
                  path: ${{ env.COVERAGE_PARENT_FOLDER }}
                  merge-multiple: true

            - name: Merge shards
              run: |
                  mkdir merged-coverage
                  npx nyc merge ${{ env.COVERAGE_PARENT_FOLDER }} merged-coverage/final-coverage.json
                  npx nyc report --temp-dir merged-coverage --reporter=json-summary --report-dir merged-coverage

            - name: Jest Coverage Comment
              uses: MishaKav/jest-coverage-comment@1b5d15445c8afba0c13bd00167bd31130b812d0a # v1.0.37
              with:
                  coverage-summary-path: ./merged-coverage/coverage-summary.json
                  title: Jest Report
                  summary-title: Summary
                  badge-title: Coverage
                  text-instead-badge: false
                  hide-comment: false
                  create-new-comment: false
                  hide-summary: false
                  remove-links-to-files: true
                  remove-links-to-lines: true
                  report-only-changed-files: true
